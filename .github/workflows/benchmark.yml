name: Benchmark

on:
  push: {}
  workflow_dispatch: {}

jobs:
  monkci-remote-cache:
    name: Monk CI with Remote Cache
    runs-on: monkci-ubuntu-24.04-4
    defaults:
      run:
        working-directory: upstream
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Install Dependencies
        run: ./script/linux

      - name: Build with Cargo
        run: cargo build --release --verbose

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  monkci-cacheless:
    name: Monk CI Cacheless
    runs-on: monkci-ubuntu-24.04-4
    defaults:
      run:
        working-directory: upstream
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: ./script/linux

      - name: Build without Cache
        run: cargo build --release --verbose

  github-local-cache:
    name: GitHub with Local Cache
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: upstream
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Install Dependencies
        run: ./script/linux

      - name: Build with Cargo
        run: cargo build --release --verbose

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  github-cacheless:
    name: GitHub Cacheless
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: upstream
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: ./script/linux

      - name: Build without Cache
        run: cargo build --release --verbose
